services:
  world-in-brief:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: demo-secret-change-me
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
